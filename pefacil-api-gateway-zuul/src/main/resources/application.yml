spring:
  application:
    name: pefacil-api-gateway-zuul

server:
  port: 8765

eureka:
  client:
    service-url:
      defaultZone: http://hr-eureka-server:8761/eureka

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 60000

ribbon:
  ConnectTimeout: 10000
  ReadTimeout: 20000

zuul:
  routes:
    pefacil-user:
      service-id: pefacil-user
      path: /pefacil-user/**
    pefacil-cart:
      service-id: pefacil-cart
      path: /pefacil-cart/**
    pefacil-order:
      service-id: pefacil-order
      path: /pefacil-order/**
    pefacil-order-item:
      service-id: pefacil-order-item
      path: /pefacil-order-item/**
    pefacil-payment:
      service-id: pefacil-payment
      path: /pefacil-payment/**
    pefacil-product:
      service-id: pefacil-product
      path: /pefacil-product/**
    oauth:
      service-id: hr-oauth
      path: /hr-oauth/**
      sensitive-headers: Cookie,Set-Cookie
